<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>CookieJar - Settings</title>
    <link rel="icon" href="../assets/icon.svg">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="header-actions">
        <button class="btn primary" id="open-dashboard"><i class="fa-solid fa-arrow-left"></i> Dashboard</button>
        <button class="btn crucial" id="wipe"><i class="fa-solid fa-trash-can"></i> Wipe database</button>
        <button class="btn secondary" id="export"><i class="fa-solid fa-file-export"></i> Export database</button>
        <button class="btn secondary" id="import"><i class="fa-solid fa-file-import"></i> Import database</button>
    </div>

    <h1>CookieJar Settings</h1>

    <div class="card">
        <h3>Miscellaneous</h3>
        <div id="misc-settings" class="card-grid">Loading content...</div>
    </div>

    <div class="card">
        <h3>Trust Providers</h3>
        <div id="trust-settings" class="card-grid">Loading content...</div>
    </div>

    <div class="card">
        <h3>VirusTotal</h3>
        <div id="virustotal-settings" class="card-grid">Loading content...</div>
    </div>

    <script src="../background/profile.js"></script>
    <script src="settings.js"></script>
</body>
</html>
