<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="card">
        <span class="card-title">Trust Level</span>
        <span id="trust-level" class="status-badge">Loading...</span>
    </div>
    <details class="card" style="display: block; cursor: pointer; margin-bottom: 12px;">
        <summary style="font-size: 0.85rem; color: #a6adc8;">Trust score resources</summary>
        <ul id="resources" style="padding-left: 16px; margin: 8px 0 0 0; font-size: 0.85rem;">
        </ul>
    </details>

    <div class="card">
        <span class="card-title">Cookies Detected</span>
        <span id="cookie-count" style="font-weight: bold;">0</span>
    </div>
    <div id="cookie-breakdown" style="font-size: 0.8rem; color: var(--text-muted); text-align: right; margin-top: -8px; margin-bottom: 12px;">
    </div>

    <button id="open-cookies" class="btn secondary"><i class="fa-solid fa-cookie-bite"></i> Open cookies & data</button>
    <button id="reload" class="btn secondary"><i class="fa-solid fa-rotate"></i> Refetch trust scores</button>
    <button id="open-dashboard" class="btn primary">Open Dashboard</button>

    <script src="../background/profile.js"></script>
    <script src="../background/helpers.js"></script>
    <script src="popup.js"></script>
</body>
</html>
